<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>กำลังเริ่มต้นระบบ... | ระบบบริหารรถบริษัทและคลังอะไหล่</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 60%, #020617 100%);
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, -apple-system, BlinkMacSystemFont, 'Noto Sans Thai', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    .container {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 44px 36px;
      border-radius: 28px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 40px rgba(59, 130, 246, 0.12);
      text-align: center;
      max-width: 520px;
      width: 90%;
      backdrop-filter: blur(20px);
      animation: fadeIn 0.6s ease-out;
    }

    .icon-container {
      position: relative;
      width: 88px;
      height: 88px;
      margin: 0 auto 24px;
    }

    .icon-box {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px -6px rgba(37, 99, 235, 0.6);
      animation: float 3s ease-in-out infinite;
    }

    .icon-box svg {
      width: 46px;
      height: 46px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .pulse-ring {
      position: absolute;
      top: -8px;
      left: -8px;
      right: -8px;
      bottom: -8px;
      border: 2px solid rgba(59, 130, 246, 0.4);
      border-radius: 30px;
      animation: pulseRing 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    h1 {
      font-size: 21px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }

    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 30px;
    }

    /* Progress bar */
    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 22px;
      position: relative;
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #3b82f6, #06b6d4, #10b981);
      border-radius: 9999px;
      animation: progressAnim 1.6s ease-in-out infinite;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 9999px;
      margin-bottom: 24px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 12px #10b981;
      animation: blink 1.2s ease-in-out infinite;
    }

    .status-text {
      font-size: 13px;
      font-weight: 500;
      color: #38bdf8;
    }

    /* Mechanic guidance box */
    .guidance-box {
      background: rgba(59, 130, 246, 0.08);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 16px;
      padding: 14px 18px;
      text-align: left;
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.6;
    }

    .guidance-box strong {
      color: #60a5fa;
      display: block;
      margin-bottom: 2px;
      font-size: 12.5px;
    }

    .retry-btn {
      margin-top: 18px;
      display: none;
      padding: 9px 20px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .retry-btn:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @keyframes pulseRing {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 0; }
      100% { transform: scale(0.95); opacity: 0; }
    }

    @keyframes progressAnim {
      0% { left: -40%; width: 40%; }
      50% { left: 30%; width: 50%; }
      100% { left: 100%; width: 40%; }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-container">
      <div class="pulse-ring"></div>
      <div class="icon-box">
        <!-- Modern Fleet Truck Icon -->
        <svg viewBox="0 0 24 24">
          <rect x="1" y="3" width="15" height="13"></rect>
          <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
          <circle cx="5.5" cy="18.5" r="2.5"></circle>
          <circle cx="18.5" cy="18.5" r="2.5"></circle>
        </svg>
      </div>
    </div>

    <h1>ระบบบริหารรถบริษัท คลังอะไหล่ และซ่อมบำรุง</h1>
    <p class="subtitle">Garage Storage & Fleet Vehicle Management System</p>

    <div class="progress-track">
      <div class="progress-bar"></div>
    </div>

    <div class="status-badge">
      <div class="status-dot" id="status-dot"></div>
      <span class="status-text" id="status-label">กำลังเริ่มต้นระบบและโหลดฐานข้อมูล...</span>
    </div>

    <div class="guidance-box">
      <strong>💡 ข้อแนะนำสำหรับผู้ใช้งาน:</strong>
      ระบบกำลังรันเซิร์ฟเวอร์และเชื่อมต่อฐานข้อมูลในเครื่อง หน้าจอหลักจะเปิดขึ้นมาอัตโนมัติในไม่กี่วินาที (ไม่จำเป็นต้องกดรีเฟรชหรือเปิดซ้ำ)
    </div>

    <button id="retry-btn" class="retry-btn" onclick="goToMain()">
      คลิกเพื่อเข้าสู่ระบบทันที (Retry)
    </button>
  </div>

  <script>
    const TARGET_URL = 'http://localhost:3000';
    let attempts = 0;
    let isRedirecting = false;

    function goToMain() {
      if (isRedirecting) return;
      isRedirecting = true;
      document.getElementById('status-label').innerText = 'ระบบพร้อมแล้ว กำลังเข้าสู่หน้าจอหลัก...';
      document.getElementById('status-dot').style.background = '#38bdf8';
      document.getElementById('status-dot').style.boxShadow = '0 0 15px #38bdf8';
      setTimeout(() => {
        window.location.replace(TARGET_URL);
      }, 250);
    }

    function checkServer() {
      if (isRedirecting) return;
      attempts++;

      // Update friendly messages based on elapsed time
      if (attempts === 5) {
        document.getElementById('status-label').innerText = 'กำลังจัดเตรียมข้อมูลอะไหล่และทะเบียนรถ...';
      } else if (attempts === 10) {
        document.getElementById('status-label').innerText = 'กำลังเตรียมความพร้อมหน้าจอหลัก...';
      } else if (attempts === 15) {
        document.getElementById('retry-btn').style.display = 'inline-block';
      }

      // Check server connectivity using Image ping (immune to CORS)
      const probe = new Image();
      let timer = setTimeout(() => {
        probe.onload = null;
        probe.onerror = null;
        if (!isRedirecting) setTimeout(checkServer, 700);
      }, 1500);

      probe.onload = () => {
        clearTimeout(timer);
        goToMain();
      };

      probe.onerror = () => {
        clearTimeout(timer);
        // Fallback probe with fetch
        fetch(TARGET_URL + '/api/settings?t=' + Date.now(), { mode: 'no-cors', cache: 'no-store' })
          .then(() => {
            goToMain();
          })
          .catch(() => {
            if (!isRedirecting) setTimeout(checkServer, 700);
          });
      };

      // Probe Next.js static asset
      probe.src = TARGET_URL + '/file.svg?t=' + Date.now();
    }

    // Start checking after a short delay
    setTimeout(checkServer, 400);
  </script>
</body>
</html>
